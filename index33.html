<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Marítimo ES</title>

<style>
body { font-family: Arial; background:#f4f7f6; padding:20px; }
.container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:10px; }

.controles { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
select,input,button { padding:10px; }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.card { background:#e9f2fa; padding:10px; text-align:center; font-weight:bold; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }

.titulo-mare {
    margin-top:20px;
    background:#0056b3;
    color:#fff;
    padding:8px;
    text-align:center;
    border-radius:5px;
}

table { width:100%; border-collapse:collapse; margin-top:10px; border-radius:8px; overflow:hidden; }
td, th { border:1px solid #ccc; padding:10px; text-align:center; }
th { background:#f1f1f1; }

.alta { color:#0056b3; font-weight:bold; }
.baixa { color:#d9534f; font-weight:bold; }

canvas { width:100%; height:200px; margin-top:10px; }
</style>
</head>

<body>

<div class="container">

<h2>🌊 Condições do Mar - ES</h2>
<p><b>Maré Oficial:</b> Porto de Tubarão</p>

<div class="controles">
<select id="cidade">
<option value="-20.3155,-40.3128">Vitória</option>
<option value="-20.3297,-40.2925">Vila Velha</option>
<option value="-20.1200,-40.1800">Serra</option>
<option value="-19.9634,-40.1132" selected>Aracruz</option>
<option value="-19.9333,-40.1500">Fundão</option>
<option value="-20.6667,-40.4999">Guarapari</option>
<option value="-19.6333,-39.8167">Linhares</option>
</select>

<input type="date" id="dataInput">

<select id="horaInicio">
<option value="0">00h</option>
<option value="6" selected>06h</option>
<option value="12">12h</option>
<option value="18">18h</option>
</select>

<select id="horaFim">
<option value="6">06h</option>
<option value="12" selected>12h</option>
<option value="18">18h</option>
<option value="23">23h</option>
</select>

<button onclick="buscar()">Buscar</button>
</div>

<div class="grid">
<div class="card">💨 <span id="vento">--</span></div>
<div class="card">🌊 <span id="ondas">--</span></div>
<div class="card">🌡️ <span id="temp">--</span></div>
<div class="card">🌧️ <span id="chuva">--</span></div>
<div class="card">🌕 <span id="lua">--</span></div>
<div class="card">🎣 <span id="atividade">--</span></div>
<div class="card">🌡️ <span id="pressao">--</span></div>
</div>

<div class="titulo-mare">
TÁBUA DE MARÉS - PORTO DE TUBARÃO (OFICIAL)
</div>

<table>
<thead>
<tr>
<th>1ª</th><th>2ª</th><th>3ª</th><th>4ª</th>
</tr>
</thead>
<tbody>
<tr id="linhaMares"></tr>
</tbody>
</table>

<canvas id="grafico"></canvas>

</div>

<script>

// ===== DIREÇÃO =====
function direcao(g){
const d=["N","NE","E","SE","S","SO","O","NO"];
return d[Math.round(g/45)%8];
}

// ===== LUA =====
function calcularLua(dataStr){
const data = new Date(dataStr);
const ciclo = 29.53;
const ref = new Date(2000,0,6);
const dias = (data-ref)/86400000;
const fase = (dias % ciclo)/ciclo;

if(fase<0.1) return "Nova";
if(fase<0.25) return "Crescente";
if(fase<0.5) return "Cheia";
if(fase<0.75) return "Minguante";
return "Nova";
}

// ===== PRESSÃO =====
function interpretarPressao(valor){
if(valor > 1015) return {texto:"🔵 Alta", cor:"#007bff"};
if(valor >= 1005) return {texto:"🟡 Média", cor:"#f0ad4e"};
return {texto:"🔴 Baixa", cor:"#d9534f"};
}

// ===== ATIVIDADE PEIXE =====
function calcularAtividadePeixe(mares, pressao){
const alturas = mares.map(m => parseFloat(m.altura));

let variacao = 0;
for(let i=1;i<alturas.length;i++){
variacao += Math.abs(alturas[i] - alturas[i-1]);
}

let score = 0;

if(variacao > 2.5) score += 2;
else if(variacao > 1.5) score += 1;

if(pressao < 1005) score += 2;
else if(pressao < 1015) score += 1;

if(score >= 3) return {nivel:"🔥 Muito Boa", cor:"green"};
if(score >= 2) return {nivel:"⚡ Boa", cor:"orange"};
return {nivel:"❌ Fraca", cor:"red"};
}

// ===== BUSCAR =====
async function buscar(){

const coords = document.getElementById('cidade').value.split(',');
const lat = coords[0];
const lng = coords[1];

const data = document.getElementById('dataInput').value;
const inicio = parseInt(document.getElementById('horaInicio').value);
const fim = parseInt(document.getElementById('horaFim').value);

if(!data) return alert("Escolha data");

try{

const clima = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation,surface_pressure&start_date=${data}&end_date=${data}&timezone=America/Sao_Paulo`
).then(r=>r.json());

const ondasApi = await fetch(
`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=wave_height&start_date=${data}&end_date=${data}&timezone=America/Sao_Paulo`
).then(r=>r.json());

const horas = clima.hourly.time.map(t=>new Date(t).getHours());

let temperaturas=[], ondas=[], vento=[], direcoes=[], chuva=[], pressaoArr=[];

horas.forEach((h,i)=>{
if(h>=inicio && h<=fim){
temperaturas.push(clima.hourly.temperature_2m[i]);
ondas.push(ondasApi.hourly.wave_height[i] || 0);
vento.push(clima.hourly.wind_speed_10m[i]);
direcoes.push(clima.hourly.wind_direction_10m[i]);
chuva.push(clima.hourly.precipitation[i]);
pressaoArr.push(clima.hourly.surface_pressure[i]);
}
});

const media = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;

const vel = media(vento);
const dir = direcao(media(direcoes));
const pressaoMedia = media(pressaoArr);

// UI clima
document.getElementById('vento').innerText = `${vel.toFixed(1)} km/h (${dir})`;
document.getElementById('ondas').innerText = `${media(ondas).toFixed(1)} m`;
document.getElementById('temp').innerText = `${media(temperaturas).toFixed(1)} °C`;
document.getElementById('chuva').innerText = `${chuva.reduce((a,b)=>a+b,0).toFixed(1)} mm`;
document.getElementById('lua').innerText = calcularLua(data);

// pressão UI
const p = interpretarPressao(pressaoMedia);
const elP = document.getElementById('pressao');
elP.innerText = `${p.texto} (${pressaoMedia.toFixed(0)} hPa)`;
elP.style.color = p.cor;

// marés
const banco = await fetch('mares.json').then(r=>r.json());

let mares = banco["20540"]?.[data] || [
{tipo:"ALTA",hora:"03:00",altura:1.8},
{tipo:"BAIXA",hora:"09:00",altura:0.5},
{tipo:"ALTA",hora:"15:00",altura:1.7},
{tipo:"BAIXA",hora:"21:00",altura:0.6}
];

// atividade peixe
const atividade = calcularAtividadePeixe(mares, pressaoMedia);
const elA = document.getElementById('atividade');
elA.innerText = atividade.nivel;
elA.style.color = atividade.cor;

// tabela
const linha = document.getElementById('linhaMares');
linha.innerHTML = '';

mares.forEach(m=>{
linha.innerHTML += `
<td>
<div class="${m.tipo==='ALTA'?'alta':'baixa'}">${m.tipo==="ALTA"?"🔼 Alta":"🔽 Baixa"}</div>
<div><b>${m.hora}</b></div>
<div>${parseFloat(m.altura).toFixed(2)} m</div>
</td>`;
});

// gráfico
desenharGrafico(mares);

}catch(e){
console.error(e);
alert("Erro ao carregar dados");
}

}

// ===== GRÁFICO SUAVE =====
function desenharGrafico(mares){

const canvas = document.getElementById('grafico');
const ctx = canvas.getContext('2d');

canvas.width = canvas.offsetWidth;
canvas.height = 200;

ctx.clearRect(0,0,canvas.width,canvas.height);

const alturas = mares.map(m=>parseFloat(m.altura));
const max = Math.max(...alturas);
const min = Math.min(...alturas);

const stepX = canvas.width/(mares.length-1);

let pontos = mares.map((m,i)=>({
x: i*stepX,
y: canvas.height - ((m.altura-min)/(max-min))*canvas.height
}));

ctx.beginPath();
ctx.moveTo(pontos[0].x,pontos[0].y);

for(let i=1;i<pontos.length;i++){
const xc = (pontos[i].x + pontos[i-1].x)/2;
const yc = (pontos[i].y + pontos[i-1].y)/2;
ctx.quadraticCurveTo(pontos[i-1].x,pontos[i-1].y,xc,yc);
}

ctx.strokeStyle="#0056b3";
ctx.lineWidth=3;
ctx.stroke();
}

</script>

</body>
</html>
