<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agradecimento - Chá de Bebê do Samir</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #eaf1e6;
      color: #4d644d;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .header {
      padding-top: 20px;
    }

    .header img {
      max-width: 320px;
      width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      font-weight: bold;
      color: #567256;
      margin-bottom: 30px;
    }

    .arabesque {
      background: url('https://kosmoverso.netlify.app/premio.jpeg') no-repeat center;
      background-size: contain;
      height: 250px;
      margin: 80px 0 40px;
    }

    .video-container {
      margin: 30px auto;
      max-width: 800px;
      width: 90%;
      background-color: #f5f1e5;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #d1cfc3;
    }

    video {
      width: 100%;
      border-radius: 8px;
      border: 2px solid #cbbda3;
      margin-bottom: 20px;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: #eaf1e6;
      color: #4d644d;
    }

    footer .arabesque {
      margin: 20px auto;
    }
  </style>
</head>
<body>
  
 <div class="header">
    <h1>Chá de Bebê do Samir</h1>
    <p class="subtitle">Nossa eterna gratidão a todos que participaram da rifa!</p>
    <div class="arabesque"></div>
  </div>
  
  <div class="video-container">
    <h2 style="color: #4d644d;">Vídeo de Agradecimento</h2>
    <video controls>
      <source src="Agradecimentos.mp4" type="video/mp4">
      Seu navegador não suporta a reprodução de vídeo.
    </video>

    <h2 style="color: #4d644d;">Vídeo do Sorteio</h2>
    <video controls>
      <source src="Sorteio.mp4" type="video/mp4">
      Seu navegador não suporta a reprodução de vídeo.
    </video>
  </div>
  
  <footer>
    <div class="arabesque"></div>
    <p>Samir, Eliene e Edgar agradecem de coração todo o carinho e apoio! 💖</p>
  </footer>

</body>
</html>
