<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Marítimo ES - Tubarão Oficial</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0056b3; margin-bottom: 5px; }
        .subtitulo { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 25px; }
        
        .controles { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        select, input[type="date"], button { padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; flex: 1; min-width: 150px; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #004494; }

        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.85em; }
        .badge { background: #e0e0e0; padding: 4px 10px; border-radius: 15px; }

        .grid-resultados { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #e9f2fa; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 4px solid #0056b3; }
        .card h3 { margin: 0; color: #0056b3; font-size: 0.9em; text-transform: uppercase; }
        .card p { font-size: 1.3em; font-weight: bold; margin: 10px 0 0; }

        .secao-mare { margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .titulo-tabela { background: #0056b3; color: white; padding: 10px; border-radius: 5px 5px 0 0; font-weight: bold; text-align: center; }
        .tabela-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #ddd; }
        th { background: #f8f9fa; color: #666; font-size: 0.8em; padding: 12px; border: 1px solid #ddd; text-transform: uppercase; }
        td { padding: 15px; text-align: center; border: 1px solid #ddd; font-weight: bold; }
        
        .mare-alta { color: #0056b3; }
        .mare-baixa { color: #d9534f; }
        .hora-mare { display: block; font-size: 1.1em; }
        .altura-mare { display: block; font-size: 0.8em; color: #777; font-weight: normal; }

        #loading { text-align: center; display: none; font-style: italic; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌊 Condições do Mar - Litoral ES</h1>
    <div class="subtitulo">Marés oficiais: Porto de Tubarão (Marinha do Brasil)</div>
    
    <div class="status-bar">
        <span id="indicadorCache">Aguardando pesquisa...</span>
        <span class="badge">Gratuito e Ilimitado</span>
    </div>

    <div class="controles">
        <select id="cidade">
            <option value="-20.3155,-40.3128">Vitória (Curva da Jurema)</option>
            <option value="-20.3297,-40.2925">Vila Velha (Praia da Costa)</option>
            <option value="-20.1200,-40.1800" selected>Serra (Jacaraípe)</option>
            <option value="-19.9634,-40.1132">Aracruz (Praia da Biologia)</option>
            <option value="-19.9333,-40.1500">Fundão (Praia Grande)</option>
            <option value="-20.6667,-40.4999">Guarapari (Centro)</option>
            <option value="-19.6333,-39.8167">Linhares (Regência)</option>
        </select>

        <!-- NOVO SELECT DE PORTO -->
        <select id="porto">
            <option value="20540" selected>Porto de Tubarão</option>
            <option value="20542">Porto de Vitória</option>
            <option value="20544">Barra do Riacho</option>
            <option value="20546">Regência</option>
        </select>

        <input type="date" id="dataInput">
        <button onclick="buscarDados()">BUSCAR DADOS</button>
    </div>

    <div id="loading">Sincronizando com Marinha e Open-Meteo...</div>

    <div id="blocoResultados" style="display: none;">
        <div class="grid-resultados">
            <div class="card"><h3>💨 Vento</h3><p id="resVento">--</p></div>
            <div class="card"><h3>🏄 Ondas</h3><p id="resOndas">--</p></div>
            <div class="card"><h3>🌧️ Chuva</h3><p id="resChuva">--</p></div>
            <div class="card"><h3>🌕 Lua</h3><p id="resLua">--</p></div>
        </div>

        <div class="secao-mare">
            <div class="titulo-tabela" id="tituloMare">TABELA DE MARÉS</div>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>1ª Maré</th>
                            <th>2ª Maré</th>
                            <th>3ª Maré</th>
                            <th>4ª Maré</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="linhaMares">
                            <td>--</td>
                            <td>--</td>
                            <td>--</td>
                            <td>--</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ADICIONE ABAIXO DA TABELA -->
<div class="secao-mare">
    <div class="titulo-tabela">GRÁFICO DE MARÉ</div>
    <canvas id="graficoMare" height="100"></canvas>
</div>

<script>
function grauParaDirecao(grau) {
    const d = ["N","NE","E","SE","S","SO","O","NO"];
    return d[Math.round(grau/45)%8];
}

// LUA (corrigido)
function calcularFaseLua(dataStr) {
    const data = new Date(dataStr + 'T12:00:00');
    const ciclo = 2551443000;
    const base = new Date(1970, 0, 7, 20, 35, 0).getTime();
    const fase = ((data.getTime() - base) % ciclo) / ciclo;

    if (fase < 0.06 || fase > 0.94) return 'Nova';
    if (fase < 0.19) return 'Crescente';
    if (fase < 0.31) return 'Quarto Crescente';
    if (fase < 0.44) return 'Crescente Gibosa';
    if (fase < 0.56) return 'Cheia';
    if (fase < 0.69) return 'Minguante Gibosa';
    if (fase < 0.81) return 'Quarto Minguante';
    return 'Minguante';
}

async function buscarDados() {
    const coords = document.getElementById('cidade').value.split(',');
    const [lat, lng] = coords;
    const porto = document.getElementById('porto').value;
    const dataSel = document.getElementById('dataInput').value;

    if(!dataSel) return alert("Escolha uma data");

    document.getElementById('loading').style.display = 'block';

    try {
        // ===== CLIMA + TEMPERATURA + VENTO =====
        const clima = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&start_date=${dataSel}&end_date=${dataSel}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation&timezone=America%2FSao_Paulo`
        ).then(r=>r.json());

        // ===== ONDAS =====
        const ondasApi = await fetch(
            `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&start_date=${dataSel}&end_date=${dataSel}&hourly=wave_height&timezone=America%2FSao_Paulo`
        ).then(r=>r.json());

        // ===== JSON MARÉS =====
        const banco = await fetch('mares.json').then(r=>r.json());

        let maresDia = banco[porto]?.[dataSel] || gerarFallback();

        // ===== DADOS =====
        const h = clima.hourly;

        const vel = h.wind_speed_10m[9];
        const dir = h.wind_direction_10m[9];
        const temp = h.temperature_2m[9];

        const ondas = ondasApi.hourly?.wave_height?.[9];

        const final = {
            vento: `${vel.toFixed(1)} km/h (${grauParaDirecao(dir)})`,
            temperatura: `${temp.toFixed(1)} °C`,
            ondas: ondas ? `${ondas.toFixed(1)} m` : '--',
            chuva: h.precipitation.reduce((a,b)=>a+b,0).toFixed(1)+" mm",
            lua: calcularFaseLua(dataSel),
            mares: maresDia.map(m => ({
                tipo: m.tipo === 'ALTA' ? '🔼 Alta' : '🔽 Baixa',
                hora: m.hora,
                altura: parseFloat(m.altura),
                classe: m.tipo === 'ALTA' ? 'mare-alta' : 'mare-baixa'
            }))
        };

        exibirDados(final);
        desenharGrafico(final.mares);

    } catch(e) {
        alert("Erro ao carregar dados");
        console.error(e);
    }

    document.getElementById('loading').style.display = 'none';
}

// ===== FALLBACK =====
function gerarFallback() {
    return [
        {tipo:'ALTA',hora:'03:00',altura:1.8},
        {tipo:'BAIXA',hora:'09:00',altura:0.5},
        {tipo:'ALTA',hora:'15:00',altura:1.7},
        {tipo:'BAIXA',hora:'21:00',altura:0.6}
    ];
}

function exibirDados(d) {
    document.getElementById('resVento').innerText = d.vento;
    document.getElementById('resOndas').innerText = d.ondas;
    document.getElementById('resChuva').innerText = d.chuva;
    document.getElementById('resLua').innerText = d.lua;

    // 🔥 NOVO: TEMPERATURA (usa campo de ondas se quiser reaproveitar card)
    document.getElementById('resOndas').innerText += ` | 🌡️ ${d.temperatura}`;

    const linha = document.getElementById('linhaMares');
    linha.innerHTML = '';

    d.mares.forEach(m=>{
        linha.innerHTML += `
        <td>
            <span class="${m.classe}">${m.tipo}</span>
            <span class="hora-mare">${m.hora}</span>
            <span class="altura-mare">${m.altura.toFixed(2)} m</span>
        </td>`;
    });

    document.getElementById('blocoResultados').style.display = 'block';
}

// ===== GRÁFICO =====
function desenharGrafico(mares) {
    const canvas = document.getElementById('graficoMare');
    const ctx = canvas.getContext('2d');

    const largura = canvas.width = canvas.offsetWidth;
    const altura = canvas.height;

    ctx.clearRect(0,0,largura,altura);

    const max = Math.max(...mares.map(m=>m.altura));
    const min = Math.min(...mares.map(m=>m.altura));

    const stepX = largura / (mares.length - 1);

    ctx.beginPath();

    mares.forEach((m,i)=>{
        const x = i * stepX;
        const y = altura - ((m.altura - min) / (max - min)) * altura;

        if(i === 0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });

    ctx.stroke();
}
</script>
</body>
</html>
