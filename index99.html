<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tábua de Maré - Pesca</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 16px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .mare-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }

    .bom {
      color: #22c55e;
      font-weight: bold;
    }

    input, button {
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin: 4px;
    }

    button {
      background: #22c55e;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    #vento {
      font-size: 18px;
    }
  </style>
</head>

<body>
  <h1>🎣 Painel de Pesca</h1>

  <div class="card">
    <h2>💨 Vento</h2>
    <div id="vento">Carregando...</div>
  </div>

  <div class="card">
    <h2>⏱️ Filtro de Horário</h2>
    <input type="time" id="inicio">
    <input type="time" id="fim">
    <button onclick="filtrar()">Filtrar</button>
  </div>

  <div class="card">
    <h2>🌊 Tábua de Maré</h2>
    <div id="mare"></div>
  </div>

<script>
  // ===== MOCK DE DADOS DE MARÉ =====
  let dadosMare = [
    { hora: "03:00", tipo: "baixa", altura: 0.4 },
    { hora: "06:00", tipo: "enchente", altura: 1.2 },
    { hora: "09:00", tipo: "alta", altura: 1.8 },
    { hora: "12:00", tipo: "vazante", altura: 1.3 },
    { hora: "15:00", tipo: "baixa", altura: 0.5 },
    { hora: "18:00", tipo: "enchente", altura: 1.4 },
    { hora: "21:00", tipo: "alta", altura: 1.9 }
  ];

  // ===== RENDER MARÉ =====
  function renderMare(lista) {
    const container = document.getElementById("mare");
    container.innerHTML = "";

    lista.forEach(item => {
      let classe = "";

      if (item.tipo === "enchente" || item.tipo === "vazante") {
        classe = "bom";
      }

      container.innerHTML += `
        <div class="mare-item ${classe}">
          <span>${item.hora}</span>
          <span>${item.tipo}</span>
          <span>${item.altura}m</span>
        </div>
      `;
    });
  }

  // ===== FILTRO =====
  function filtrar() {
    const inicio = document.getElementById("inicio").value;
    const fim = document.getElementById("fim").value;

    const filtrado = dadosMare.filter(item => {
      return (!inicio || item.hora >= inicio) && (!fim || item.hora <= fim);
    });

    renderMare(filtrado);
  }

  // ===== DIREÇÃO DO VENTO =====
  function grauParaDirecao(grau) {
    const direcoes = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
    const index = Math.round(grau / 45) % 8;
    return direcoes[index];
  }

  // ===== API DE VENTO (OpenWeather) =====
  async function carregarVento() {
    try {
      const lat = -20.12; // ajuste se quiser
      const lon = -40.30;
      const apiKey = "b12494956ef4bb8a2cfd18461bc7ac8e";

      const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`);
      const data = await res.json();

      const velocidade = (data.wind.speed * 3.6).toFixed(1);
      const direcao = grauParaDirecao(data.wind.deg);

      document.getElementById("vento").innerHTML = `💨 ${velocidade} km/h (${direcao})`;
    } catch (e) {
      document.getElementById("vento").innerHTML = "Erro ao carregar vento";
    }
  }

  // ===== INIT =====
  renderMare(dadosMare);
  carregarVento();
</script>

</body>
</html>
