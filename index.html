<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mar ES</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to bottom, #dfefff, #ffffff);
    margin:0;
    padding:10px;
}

.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    padding:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2 { text-align:center; margin-bottom:5px; }

.sub { text-align:center; font-size:13px; color:#666; margin-bottom:10px; }

.controles {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
}

select,input,button {
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button {
    grid-column:span 2;
    background:#007bff;
    color:#fff;
    border:none;
}

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.card {
    background:#f0f6ff;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}

.titulo {
    margin-top:15px;
    background:#0056b3;
    color:#fff;
    padding:8px;
    border-radius:8px;
    text-align:center;
}

table {
    width:100%;
    margin-top:8px;
    border-collapse:collapse;
}

td {
    padding:8px;
    text-align:center;
    font-size:13px;
}

canvas {
    width:100%;
    height:180px;
    margin-top:10px;
}

/* Peixes */
.peixes {
    margin-top:10px;
    background:#eaf7ea;
    padding:10px;
    border-radius:10px;
}

.peixes h4 {
    margin:0 0 5px;
}

</style>
</head>

<body>

<div class="container">

<h2>🌊 Mar ES</h2>
<div class="sub">Maré oficial: Tubarão</div>

<div class="controles">
<select id="cidade">
<option value="-20.3155,-40.3128">Vitória</option>
<option value="-20.1200,-40.1800" selected>Serra</option>
<option value="-20.6667,-40.4999">Guarapari</option>
</select>

<input type="date" id="dataInput">

<select id="horaInicio">
<option value="6">06h</option>
<option value="12" selected>12h</option>
<option value="18">18h</option>
</select>

<select id="horaFim">
<option value="12">12h</option>
<option value="18" selected>18h</option>
<option value="23">23h</option>
</select>

<button onclick="buscar()">Buscar</button>
</div>

<div class="grid">
<div class="card">💨 <span id="vento">--</span></div>
<div class="card">🌊 <span id="ondas">--</span></div>
<div class="card">🌡️ <span id="temp">--</span></div>
<div class="card">🌧️ <span id="chuva">--</span></div>
<div class="card">🌕 <span id="lua">--</span></div>
<div class="card">🎣 <span id="atividade">--</span></div>
<div class="card">📊 <span id="pressao">--</span></div>
</div>

<div class="titulo">TÁBUA DE MARÉS</div>
<table>
<tr id="linhaMares"></tr>
</table>

<canvas id="grafico"></canvas>

<div class="peixes">
<h4>🐟 Espécies indicadas</h4>
<div id="listaPeixes">--</div>
</div>

</div>

<script>

// ===== LUA =====
function calcularLua(dataStr){
const d=new Date(dataStr);
const dias=(d-new Date(2000,0,6))/86400000;
const fase=(dias%29.53)/29.53;
if(fase<0.25) return "Crescente";
if(fase<0.5) return "Cheia";
if(fase<0.75) return "Minguante";
return "Nova";
}

// ===== DIREÇÃO =====
function direcao(g){
const d=["N","NE","E","SE","S","SO","O","NO"];
return d[Math.round(g/45)%8];
}

// ===== PRESSÃO =====
function interpretarPressao(v){
if(v>1015) return {txt:"🔵 Alta", cor:"blue"};
if(v>=1005) return {txt:"🟡 Média", cor:"orange"};
return {txt:"🔴 Baixa", cor:"red"};
}

// ===== ATIVIDADE =====
function calcularAtividade(mares,pressao){
let variacao=0;
for(let i=1;i<mares.length;i++){
variacao+=Math.abs(mares[i].altura-mares[i-1].altura);
}

let score=0;
if(variacao>2.5) score+=2;
else if(variacao>1.5) score+=1;

if(pressao<1005) score+=2;
else if(pressao<1015) score+=1;

if(score>=3) return "🔥 Muito Boa";
if(score>=2) return "⚡ Boa";
return "❌ Fraca";
}

// ===== PEIXES =====
function sugerirPeixes(nivel){
if(nivel.includes("Muito Boa"))
return "Robalo, Dourado, Anchova, Olhete";

if(nivel.includes("Boa"))
return "Pescada, Corvina, Xaréu";

return "Tilápia, Bagre";
}

// ===== BUSCAR =====
async function buscar(){

const coords=document.getElementById('cidade').value.split(',');
const lat=coords[0];
const lng=coords[1];
const data=document.getElementById('dataInput').value;

if(!data) return alert("Escolha data");

const clima=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation,surface_pressure&start_date=${data}&end_date=${data}&timezone=America/Sao_Paulo`
).then(r=>r.json());

const ondasApi=await fetch(
`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=wave_height&start_date=${data}&end_date=${data}`
).then(r=>r.json());

const media=a=>a.reduce((x,y)=>x+y,0)/a.length;

document.getElementById('temp').innerText=media(clima.hourly.temperature_2m).toFixed(1)+"°C";
document.getElementById('vento').innerText=media(clima.hourly.wind_speed_10m).toFixed(1)+" km/h";
document.getElementById('ondas').innerText=media(ondasApi.hourly.wave_height).toFixed(1)+" m";
document.getElementById('chuva').innerText=clima.hourly.precipitation.reduce((a,b)=>a+b,0).toFixed(1)+" mm";

const pressao=media(clima.hourly.surface_pressure);
const p=interpretarPressao(pressao);
document.getElementById('pressao').innerText=p.txt+" "+pressao.toFixed(0)+"hPa";

document.getElementById('lua').innerText=calcularLua(data);

// mares fake (ou JSON)
const mares=[
{tipo:"ALTA",hora:"03:00",altura:1.8},
{tipo:"BAIXA",hora:"09:00",altura:0.5},
{tipo:"ALTA",hora:"15:00",altura:1.7},
{tipo:"BAIXA",hora:"21:00",altura:0.6}
];

// tabela
const linha=document.getElementById('linhaMares');
linha.innerHTML='';
mares.forEach(m=>{
linha.innerHTML+=`<td>${m.tipo}<br>${m.hora}<br>${m.altura}m</td>`;
});

// atividade + peixes
const atividade=calcularAtividade(mares,pressao);
document.getElementById('atividade').innerText=atividade;
document.getElementById('listaPeixes').innerText=sugerirPeixes(atividade);

// gráfico
desenharGrafico(mares);
}

// ===== GRÁFICO =====
function desenharGrafico(mares){
const c=document.getElementById('grafico');
const ctx=c.getContext('2d');
c.width=c.offsetWidth;
c.height=180;

ctx.clearRect(0,0,c.width,c.height);

let pts=mares.map((m,i)=>({
x:i*(c.width/(mares.length-1)),
y:c.height-m.altura*60
}));

ctx.beginPath();
ctx.moveTo(pts[0].x,pts[0].y);

for(let i=1;i<pts.length;i++){
let xc=(pts[i].x+pts[i-1].x)/2;
let yc=(pts[i].y+pts[i-1].y)/2;
ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,xc,yc);
}

ctx.strokeStyle="#007bff";
ctx.lineWidth=2;
ctx.stroke();
}

</script>

</body>
</html>
